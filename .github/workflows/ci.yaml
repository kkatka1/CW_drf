name: Django CI/CD Pipeline

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: flake8 .

  test:
    needs: lint
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DEBUG: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django tests
        run: python manage.py test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker images
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/web:${{ github.sha }} -f Dockerfile .
          docker build -t ${{ secrets.DOCKER_USERNAME }}/celery:${{ github.sha }} -f Dockerfile .
          docker build -t ${{ secrets.DOCKER_USERNAME }}/celery-beat:${{ github.sha }} -f Dockerfile .

      - name: Push Docker images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/web:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/celery:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/celery-beat:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          cd /var/www/myapp || exit 1
          git reset --hard origin/main
          docker compose --env-file .env.prod pull
          docker compose --env-file .env.prod down
          docker compose --env-file .env.prod up -d --build
          EOF
