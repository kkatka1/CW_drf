version: "3"

services:
  web:
    build: .
    command: >
      bash -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000
      "
    env_file:
      - .env.docker
    ports:
      - "8080:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    depends_on:
      - redis
      - db

  db:
    image: postgres:16
    restart: always
    env_file:
      - .env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6
    restart: always

  celery:
    build: .
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env.docker
    depends_on:
      - web
      - redis
      - db

  celery_beat:
    build: .
    command: celery -A config beat -l info
    volumes:
      - .:/app
    env_file:
      - .env.docker
    depends_on:
      - web
      - redis
      - db

volumes:
  postgres_data:
  static_volume: